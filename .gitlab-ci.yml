# Teamwork Integration for GitLab CI/CD
# Include this in your repository with:
#
# include:
#   - remote: 'https://raw.githubusercontent.com/darylldoyle/github-sync/refs/heads/develop/.gitlab-ci.yml'
#
# Required variables to set in CI/CD settings:
# - TEAMWORK_URI: Your Teamwork domain (e.g., https://yourcompany.teamwork.com)
# - TEAMWORK_API_TOKEN: Your Teamwork API token
teamwork:
    stage: test
    image: alpine:latest
    before_script:
        - apk add --no-cache bash curl jq git
    script:
        - |
            git clone -b develop https://github.com/darylldoyle/github-sync.git /tmp/teamwork-sync
            cd /tmp/teamwork-sync
            
            echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
            echo "CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID"
            echo "event_type: $event_type"
            echo "action: $action"
            
            # Set up environment based on trigger source
            if [ "$CI_PIPELINE_SOURCE" == "trigger" ] && [ "$event_type" == "merge_request" ] && [ "$action" == "approved" ]; then
                # This is a webhook approval event - use merge_request_id from webhook
                export CI_MERGE_REQUEST_IID="$merge_request_id"
                echo "Setting CI_MERGE_REQUEST_IID=$CI_MERGE_REQUEST_IID from webhook payload"
            
                API_ENDPOINT="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
                echo "Making request to ${API_ENDPOINT} to fetch MR details"
                
                # We need to fetch other MR details since they won't be available as CI variables
                MR_DATA=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                    "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}")
            
                echo "Fetched MR data: $MR_DATA"
                
                # Set variables that would normally be provided by GitLab CI
                export CI_MERGE_REQUEST_SOURCE_BRANCH_NAME=$(echo "$MR_DATA" | jq -r '.source_branch')
                export CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$(echo "$MR_DATA" | jq -r '.target_branch')
                export CI_MERGE_REQUEST_TITLE=$(echo "$MR_DATA" | jq -r '.title')
                export CI_MERGE_REQUEST_DESCRIPTION=$(echo "$MR_DATA" | jq -r '.description')
                export CI_MERGE_REQUEST_SOURCE_PROJECT_URL=$(echo "$MR_DATA" | jq -r '.source.web_url')
                export CI_MERGE_REQUEST_EVENT_TYPE="approval_webhook"
                export CI_MERGE_REQUEST_APPROVED="true"
            
                # Debug info
                echo "Processing webhook approval event for MR #$CI_MERGE_REQUEST_IID"
                echo "Source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
                echo "Target branch: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
            else
                # Regular MR event - all variables should be set by GitLab
                echo "Processing regular MR event for MR #$CI_MERGE_REQUEST_IID"
            fi
          
            # Standard environment variables
            export TEAMWORK_URI="${TEAMWORK_URI}"
            export TEAMWORK_API_TOKEN="${TEAMWORK_API_TOKEN}"
            export AUTOMATIC_TAGGING="${AUTOMATIC_TAGGING:-true}"
            export MAKE_COMMENTS_PRIVATE="${MAKE_COMMENTS_PRIVATE:-false}"
            export BOARD_COLUMN_OPENED="${BOARD_COLUMN_OPENED:-}"
            export BOARD_COLUMN_MERGED="${BOARD_COLUMN_MERGED:-}"
            export BOARD_COLUMN_CLOSED="${BOARD_COLUMN_CLOSED:-}"
            export BOARD_COLUMN_REVIEWED="${BOARD_COLUMN_REVIEWED:-}"
            export GITLAB_TOKEN="${GITLAB_TOKEN}"
            export ENV="production"
          
            # Use entrypoint.sh which will handle execution correctly
            chmod +x ./entrypoint.sh
            ./entrypoint.sh

    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: '$CI_PIPELINE_SOURCE == "trigger" && $event_type == "merge_request" && $action == "approved" && $merge_request_id'  # Webhook approval events

